<figure class="inline-image">
  <audio width="100%" controls>
    <source src="{{ src }}" type="{% if type %}{{ type }}{% else %}audio/ogg{% endif %}">
    Your browser does not support the audio element.
  </audio>
  {% if caption %}
    <figcaption>
      <p>{% if emoji %}{{ emoji }} {% endif %}{% if nonitalic %}{{ caption }}{% else %}<i>{{ caption }}</i>{% endif %}</p>
    </figcaption>
  {% endif %}
</figure>
